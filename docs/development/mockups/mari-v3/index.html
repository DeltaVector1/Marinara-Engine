<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Professor Mari · in action · v3</title>
<style>
@font-face { font-family: "Inter"; src: url(fonts/Inter-Regular.woff2) format("woff2"); font-weight: 400; font-display: swap; }
@font-face { font-family: "Inter"; src: url(fonts/Inter-SemiBold.woff2) format("woff2"); font-weight: 500 700; font-display: swap; }
@font-face { font-family: "Mono Serif"; src: url(fonts/DMSerifDisplay-Regular.woff2) format("woff2"); font-display: swap; }

/* ─── App tokens, copied from packages/client/src/styles/globals.css ─── */
:root, [data-theme="dark"] {
  color-scheme: dark;
  --background: #050312;
  --foreground: #d4d4d4;
  --card: #141414d9;
  --primary: #ec4b97;
  --muted: #1a1a2e;
  --muted-foreground: #a1a1aa;
  --accent: #2a1a3e;
  --destructive: #ff6b9d;
  --border: color-mix(in srgb, var(--primary) 20%, transparent);
  --ring: var(--primary);
  --radius: 0.75rem;
  --mari-logo-cyan: #4de5dd;
  --mari-logo-orange: #eb8951;
  --mari-logo-pink: #e15c8c;
  --marinara-app-accent-solid: var(--primary);
  --marinara-chat-chrome-accent: var(--primary);
  --marinara-chat-chrome-input-bg: var(--card);
  --marinara-chat-chrome-input-border: color-mix(in srgb, var(--marinara-chat-chrome-accent) 14%, transparent);
  --marinara-chat-chrome-highlight-bg-hover: color-mix(in srgb, var(--marinara-chat-chrome-accent) 13%, transparent);
  --marinara-chat-chrome-button-text-hover: color-mix(in srgb, var(--marinara-chat-chrome-accent) 92%, transparent);
  --font-y2k: "Straight Quotes", var(--font-user, "Inter"), -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;

  /* Direction A · Quiet, from cards-v2 */
  --strong: #f4f4f5;
  --hairline: color-mix(in srgb, var(--foreground) 13%, transparent);
  --surface: color-mix(in srgb, var(--foreground) 4%, var(--background));
  --surface-2: color-mix(in srgb, var(--foreground) 8%, var(--background));
  --hover: color-mix(in srgb, var(--foreground) 7%, transparent);
  --ins-bg: color-mix(in srgb, #34d399 16%, transparent);
  --ins-line: #34d399;
  --ok: #6ee7b7;
  --danger-fill: #dc2626;
  --danger-text: #fca5a5;
  --backdrop-card: #0d0a1c;
}
[data-theme="light"] {
  color-scheme: light;
  --background: #faf8ff;
  --foreground: #1a1025;
  --card: #ffffffee;
  --muted: #f0eaf7;
  --muted-foreground: #65656f;
  --accent: #ede4f7;
  --destructive: #c44040;
  --border: color-mix(in srgb, var(--primary) 27%, transparent);

  --strong: #120a1c;
  --hairline: color-mix(in srgb, var(--foreground) 12%, transparent);
  --surface: #ffffff;
  --surface-2: color-mix(in srgb, var(--foreground) 5%, #ffffff);
  --hover: color-mix(in srgb, var(--foreground) 6%, transparent);
  --ins-bg: color-mix(in srgb, #10b981 15%, transparent);
  --ins-line: #059669;
  --ok: #047857;
  --danger-fill: var(--destructive);
  --danger-text: #b42318;
  --backdrop-card: #ffffff;
}
@font-face { font-family: "Straight Quotes"; src: local("Arial"), local("Helvetica"); unicode-range: U+0022, U+0027; }

* { box-sizing: border-box; }
html, body { height: 100%; }
body { margin: 0; overflow: hidden; background: var(--background); color: var(--foreground); font-family: var(--font-y2k); font-size: 0.875rem; line-height: 1.6; -webkit-font-smoothing: antialiased; }
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; }
:focus-visible { outline: 2px solid var(--ring); outline-offset: 2px; }
svg { flex: none; }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

/* ─── The app behind the omnibar (a stand-in for Home) ─── */
.app { position: fixed; inset: 0; display: grid; grid-template-rows: 3.25rem 2.75rem 1fr; }
.app-top { display: flex; align-items: center; gap: 1rem; padding: 0 1rem; border-bottom: 1px solid var(--border); }
.app-dot { width: 1.1rem; height: 1.1rem; border-radius: 0.3rem; background: color-mix(in srgb, var(--foreground) 22%, transparent); }
.app-dot--p { background: color-mix(in srgb, var(--primary) 55%, transparent); }
.app-tabs { display: flex; gap: 0.5rem; padding: 0.4rem 1rem 0; }
.app-tab { width: 7rem; border-radius: 0.6rem 0.6rem 0 0; background: color-mix(in srgb, var(--foreground) 6%, transparent); }
.app-grid { display: grid; grid-template-columns: 2fr 1fr; grid-template-rows: 1fr 1fr; gap: 1rem; padding: 1rem; }
.app-card { border: 1px solid var(--border); border-radius: 1rem; background: var(--backdrop-card); padding: 1.25rem; }
.app-card i { display: block; height: 0.6rem; width: 30%; border-radius: 99px; background: color-mix(in srgb, var(--primary) 45%, transparent); margin-bottom: 0.8rem; }
.app-card b { display: block; height: 1.1rem; width: 55%; border-radius: 99px; background: color-mix(in srgb, var(--foreground) 22%, transparent); }
@media (max-width: 40rem) { .app { display: none; } }

/* ─── Omnibar overlay and panel (GlobalOmnibar.tsx) ─── */
.overlay { position: fixed; inset: 0; z-index: 100; display: flex; align-items: flex-start; justify-content: center; background: rgb(0 0 0 / 0.55); backdrop-filter: blur(4px); }
.panel { position: relative; isolation: isolate; display: flex; flex-direction: column; width: 100%; height: 100dvh; overflow: hidden; background: var(--card); }
@media (min-width: 40rem) {
  .overlay { padding: 10vh 1.5rem 0; }
  .panel { max-width: 44rem; height: min(44rem, 80dvh); border-radius: 1rem; box-shadow: 0 24px 60px -12px rgba(0, 0, 0, 0.55), 0 0 0 1px color-mix(in srgb, var(--border) 60%, transparent); }
}
.panel-tint { pointer-events: none; position: absolute; inset: 0 0 auto; z-index: -1; height: 11rem; background: radial-gradient(120% 100% at 12% 0%, oklch(0.72 0.16 255 / 0.12), transparent 60%), radial-gradient(120% 100% at 88% 0%, oklch(0.73 0.21 345 / 0.11), transparent 60%); }

.mari-workspace-shell {
  --mari-workspace-gold: oklch(0.82 0.11 79);
  --mari-workspace-hoodie: oklch(0.62 0.1 252);
  --mari-workspace-blush: oklch(0.76 0.14 344);
  background: color-mix(in srgb, var(--background) 94%, oklch(0.22 0.035 326));
}
[data-theme="light"] .mari-workspace-shell { background: color-mix(in srgb, var(--background) 96%, oklch(0.93 0.025 73)); }
[data-theme="light"] { --mari-gold-text: oklch(0.55 0.11 70); }
[data-theme="dark"] { --mari-gold-text: var(--mari-workspace-gold); }

.omni-head { position: relative; z-index: 50; flex: none; padding-top: env(safe-area-inset-top); }
.mari-workspace-header { display: flex; align-items: center; gap: 0.5rem; height: 3.5rem; padding: 0 1rem; border-bottom: 1px solid color-mix(in srgb, var(--mari-workspace-blush) 18%, var(--border)); background: color-mix(in srgb, var(--card) 96%, var(--mari-workspace-hoodie)); }
.icon-btn { display: inline-grid; place-items: center; width: 2.25rem; height: 2.25rem; flex: none; border-radius: 0.375rem; color: var(--muted-foreground); }
.icon-btn:hover { background: var(--accent); }
.head-title { display: flex; min-width: 0; flex: 1; align-items: center; gap: 0.5rem; }
.head-copy { min-width: 0; }
.head-copy > span { display: block; line-height: 1.25; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.head-copy .t { font-size: 0.875rem; font-weight: 600; color: var(--foreground); }
.head-copy .s { font-size: 0.6875rem; font-weight: 500; color: var(--muted-foreground); }

/* Portrait + the glow behind her head (globals.css) */
[data-mari-glow] { position: relative; isolation: isolate; }
@property --angle { syntax: "<angle>"; inherits: false; initial-value: 0deg; }
@keyframes gradient-rotate { to { --angle: 360deg; } }
[data-mari-glow="true"]::before { position: absolute; top: var(--mari-glow-top, 0.3rem); left: 50%; z-index: -1; width: var(--mari-glow-size, 2.6rem); height: var(--mari-glow-size, 2.6rem); border-radius: 50%; content: ""; pointer-events: none; background: conic-gradient(from var(--angle), var(--mari-logo-pink), var(--mari-logo-orange), var(--mari-logo-cyan), var(--mari-logo-pink)); opacity: 0.75; filter: blur(0.5rem); translate: -50% 0; animation: gradient-rotate 2.6s linear infinite; }
.mari-portrait-glow-anchor { display: inline-flex; flex: none; --mari-glow-top: -0.4rem; --mari-glow-size: 3.7rem; }
.mari-workspace-portrait { position: relative; display: grid; width: 3rem; height: 3rem; place-items: start center; overflow: hidden; filter: drop-shadow(0 0 0.65rem color-mix(in srgb, var(--mari-workspace-blush) 18%, transparent)); }
.mari-workspace-portrait img { position: absolute; top: -0.1rem; width: 3rem; height: auto; max-width: none; image-rendering: pixelated; }
.mari-workspace-portrait [data-part="idle"] { animation: mari-workspace-rare-idle 11s steps(1, end) infinite; }
.mari-workspace-portrait [data-part="blink"] { opacity: 0; animation: mari-workspace-rare-blink 11s steps(1, end) infinite; }
.mari-workspace-portrait[data-state="thinking"] { filter: drop-shadow(0 0 0.8rem color-mix(in srgb, var(--mari-workspace-hoodie) 30%, transparent)); }
.mari-workspace-portrait[data-state="thinking"] img { animation: mari-workspace-thinking 900ms steps(2, end) infinite; }
.mari-workspace-portrait[data-state="warning"] { filter: drop-shadow(0 0 0.7rem color-mix(in srgb, oklch(0.72 0.18 38) 24%, transparent)); }
@keyframes mari-workspace-thinking { 0%, 100% { transform: translateY(0.15rem); } 50% { transform: translateY(0.05rem); } }
@keyframes mari-workspace-rare-idle { 0%, 91%, 94%, 100% { opacity: 1; } 92%, 93% { opacity: 0; } }
@keyframes mari-workspace-rare-blink { 0%, 91%, 94%, 100% { opacity: 0; } 92%, 93% { opacity: 1; } }
.mari-status-shimmer[data-active="true"] { background: linear-gradient(100deg, var(--muted-foreground) 35%, var(--foreground) 50%, var(--muted-foreground) 65%) 0 0 / 250% 100%; background-clip: text; -webkit-background-clip: text; color: transparent; animation: mari-text-shimmer 2.2s linear infinite; }
@keyframes mari-text-shimmer { from { background-position: 100% 0; } to { background-position: -150% 0; } }

/* Header row: Chats / Skills / Memories / Context, the mode pill, new chat */
.mari-omnibar-header-row { position: relative; z-index: 50; display: flex; align-items: center; min-height: 2.75rem; padding-inline: 0.5rem; border-bottom: 1px solid color-mix(in srgb, var(--mari-workspace-blush) 16%, var(--border)); background: color-mix(in srgb, var(--card) 92%, var(--mari-workspace-hoodie)); }
.dest { display: flex; flex: 1; justify-content: safe center; overflow-x: auto; scrollbar-width: none; }
.dest button { position: relative; display: flex; align-items: center; gap: 0.35rem; min-height: 2.25rem; padding-inline: 0.55rem; color: var(--muted-foreground); font-size: 0.6875rem; transition: color 160ms ease; }
.dest button:hover { color: var(--foreground); }
.mode { display: inline-flex; min-height: 2.75rem; align-items: center; gap: 0.35rem; border: 1px solid var(--border); border-radius: 999px; padding-inline: 0.65rem; color: var(--muted-foreground); font-size: 0.6875rem; font-weight: 600; white-space: nowrap; }
.mode:hover { background: var(--accent); color: var(--foreground); }
.row-btn { display: inline-grid; place-items: center; width: 2.75rem; height: 2.75rem; flex: none; border-radius: 0.45rem; color: var(--muted-foreground); }
.row-btn:hover { background: var(--accent); }
.more { display: none; }

/* ─── Canvas + transcript ─── */
.mari-workspace-canvas { position: relative; display: flex; min-height: 0; flex: 1; flex-direction: column; background: color-mix(in srgb, var(--background) 97%, oklch(0.2 0.025 315)); }
.panel .mari-workspace-canvas { background: transparent; }
.transcript { min-height: 0; flex: 1; overflow-y: auto; scrollbar-gutter: stable; overscroll-behavior: contain; scrollbar-width: thin; scrollbar-color: color-mix(in srgb, var(--foreground) 18%, transparent) transparent; }
.transcript[data-following="true"] { mask-image: linear-gradient(to bottom, rgb(0 0 0 / 0.35), #000 3rem); }
.stack { display: flex; min-height: 100%; flex-direction: column; justify-content: flex-end; gap: 1.25rem; width: 100%; max-width: 44rem; margin-inline: auto; padding: 1.5rem 1.75rem 0.5rem; }

/* Welcome (the real hero, smaller in the card) */
.welcome { display: flex; align-items: center; gap: 1.25rem; margin: auto 0; padding: 0 0.5rem; transition: opacity 0.25s ease, transform 0.25s ease; }
.welcome.leaving { opacity: 0; transform: translateY(-0.5rem); }
.welcome .mari-story-sprite { width: 5rem; height: 7.5rem; }
.welcome h2 { margin: 0; font-size: 1.75rem; line-height: 1.15; font-weight: 700; letter-spacing: -0.01em; background: linear-gradient(90deg, var(--mari-logo-cyan), var(--mari-logo-pink) 55%, var(--mari-logo-orange)); -webkit-background-clip: text; background-clip: text; color: transparent; }
.welcome p { margin: 0.4rem 0 0; color: var(--muted-foreground); font-size: 0.875rem; max-width: 30rem; }

/* Your turn: a soft bubble on the right */
.mari-user-request { display: flex; flex-direction: column; align-items: flex-end; gap: 0.3rem; padding-block: 0.25rem; }
.mari-user-request__bubble { max-width: min(85%, 36rem); padding: 0.55rem 0.9rem; border-radius: 1.25rem 1.25rem 0.375rem 1.25rem; background: color-mix(in srgb, var(--foreground) 7%, var(--card)); color: var(--foreground); }
.facet { display: inline-flex; align-items: center; gap: 0.3rem; font-size: 0.6875rem; color: var(--muted-foreground); }
.facet svg { color: var(--primary); }
.mari-user-request.pending .mari-user-request__bubble { opacity: 0.72; }
.fail { display: flex; align-items: center; gap: 0.35rem; font-size: 0.75rem; color: var(--danger-text); }
.fail .link { height: 1.75rem; color: var(--strong); text-decoration: underline; text-underline-offset: 3px; text-decoration-color: var(--hairline); padding: 0 0.35rem; }
.sending { font-size: 0.75rem; color: var(--muted-foreground); }

/* ─── Mari's turn: document layout, no avatar (TranscriptRow layout="document") ─── */
.mari-turn { display: flex; flex-direction: column; gap: 0.9rem; min-width: 0; }
.flow { display: flex; flex-direction: column; gap: 0.9rem; min-width: 0; }
.md { margin: 0; max-width: 64ch; color: var(--foreground); }
.md strong { color: var(--strong); font-weight: 600; }
.mari-stream-word { animation: mari-word-in 0.55s cubic-bezier(0.22, 1, 0.36, 1) both; }
@keyframes mari-word-in { from { opacity: 0; filter: blur(4px); } }
.mari-stream-caret { display: inline-block; width: 0.5rem; height: 0.5rem; margin-inline-start: 0.2rem; border-radius: 50%; vertical-align: middle; background: radial-gradient(circle, var(--mari-workspace-gold), transparent 70%); box-shadow: 0 0 0.6rem var(--mari-logo-orange); animation: mari-caret-pulse 0.9s ease-in-out infinite; }
@keyframes mari-caret-pulse { 50% { opacity: 0.6; transform: scale(0.6); } }
.enter { animation: rise-in 0.45s cubic-bezier(0.16, 1, 0.3, 1) both; }
@keyframes rise-in { from { opacity: 0; transform: translateY(6px); filter: blur(4px); } }

/* A · Quiet: steps as one-line disclosures */
.steps { display: flex; flex-direction: column; gap: 0; margin: -0.35rem 0; }
.steps summary, .thought { display: flex; align-items: center; gap: 0.5rem; width: fit-content; max-width: 100%; min-height: 1.9rem; padding: 0.1rem 0.5rem; margin-left: -0.5rem; border-radius: 0.5rem; font-size: 0.8125rem; color: var(--muted-foreground); list-style: none; cursor: pointer; }
.steps summary::-webkit-details-marker { display: none; }
.steps summary:hover, .thought:hover { background: var(--hover); color: var(--foreground); }
.steps .q { color: var(--foreground); }
.steps .dur { font-size: 0.6875rem; font-variant-numeric: tabular-nums; color: color-mix(in srgb, var(--muted-foreground) 78%, transparent); }
.chev { opacity: 0.7; transition: transform 0.16s ease; }
details[open] > summary .chev, [aria-expanded="true"] > .chev { transform: rotate(90deg); }
.step-detail { margin: 0.2rem 0 0.4rem 1.5rem; padding-left: 0.75rem; border-left: 1px solid var(--hairline); font-size: 0.75rem; color: var(--muted-foreground); display: flex; flex-direction: column; gap: 0.1rem; }
.step-detail b { color: var(--foreground); font-weight: 600; }
.thought .star { color: var(--mari-gold-text); }
.turn-folded .steps, .turn-folded .thought { display: none; }

/* The live line: always last, working Mari leads it (globals.css) */
.mari-work-timeline__live { display: flex; min-width: 0; min-height: 4.75rem; align-items: center; gap: 0.6rem; margin-left: -0.5rem; padding-inline: 0.5rem; color: var(--muted-foreground); font-size: 0.6875rem; font-weight: 600; }
.mari-live-work__sprite { position: relative; flex: none; width: 3rem; height: 4.5rem; pointer-events: none; }
.mari-live-work__sprite > span { position: absolute; inset: 0; background-image: var(--mari-work-sprite); background-position: 0 center; background-size: 400% 100%; background-repeat: no-repeat; image-rendering: pixelated; animation: mari-appearance-story 4.8s step-end both, mari-sprite-arrive 0.45s cubic-bezier(0.16, 1, 0.3, 1) both; }
.mari-live-work__sprite[data-role="working"]::after { position: absolute; right: 20%; bottom: -0.1rem; left: 20%; height: 0.3rem; border-radius: 50%; content: ""; background: oklch(0 0 0 / 0.4); filter: blur(2px); }
[data-theme="light"] .mari-live-work__sprite[data-role="working"]::after { background: oklch(0 0 0 / 0.18); }
.mari-live-work__sprite[data-role="working"] > span::before { position: absolute; inset: -25%; content: ""; pointer-events: none; background: radial-gradient(circle, var(--mari-workspace-gold) 0 1.5px, transparent 2px) 50% 50% / 34% 34%; mask-image: radial-gradient(circle, transparent 28%, #000 30%, #000 60%, transparent 62%); opacity: 0; animation: mari-sprite-puff 0.7s cubic-bezier(0.16, 1, 0.3, 1); }
.mari-live-work__sprite[data-rest="true"] > span { animation: mari-appearance-story 4.8s step-end both; }
@keyframes mari-appearance-story { 0%, 24% { background-position: 0 center; } 25%, 49% { background-position: 33.333333% center; } 50%, 74% { background-position: 66.666667% center; } 75%, 100% { background-position: 100% center; } }
@keyframes mari-sprite-arrive { from { opacity: 0; transform: scale(0.6) translateY(0.4rem); } 45% { opacity: 1; transform: scale(1.04) translateY(-0.45rem); } 75% { transform: translateY(0.05rem); } }
@keyframes mari-sprite-puff { from { opacity: 1; transform: scale(0.5) rotate(0deg); } to { opacity: 0; transform: scale(1.25) rotate(45deg); } }
.mari-story-sprite { display: inline-block; flex: none; width: 3rem; height: 4.5rem; }
.mari-story-sprite > span { display: block; width: 100%; height: 100%; background-image: var(--mari-work-sprite); background-size: 400% 100%; background-repeat: no-repeat; image-rendering: pixelated; animation: mari-appearance-story 4.8s step-end both; }

.mari-work-timeline__phrase { position: relative; flex: 1; min-width: 0; height: 1.4rem; color: var(--foreground); font-size: 0.875rem; font-weight: 600; }
.mari-work-timeline__line { position: absolute; inset: 0; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; mask-image: linear-gradient(100deg, #000 38%, #0006 50%, #000 62%); mask-size: 280% 100%; animation: mari-headline-sheen 2.2s linear infinite; }
.mari-work-timeline__line.leaving { animation: line-out 0.28s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
@keyframes line-out { to { opacity: 0; transform: translateY(-8px); filter: blur(4px); } }
.mari-work-timeline__char { display: inline-block; white-space: pre; animation: mari-char-in 0.55s cubic-bezier(0.16, 1, 0.3, 1) both; animation-delay: calc(var(--i) * 16ms); }
.mari-work-timeline__subject-text { color: var(--mari-gold-text); }
@keyframes mari-headline-sheen { from { mask-position: 100% 0; } to { mask-position: -180% 0; } }
@keyframes mari-char-in { from { opacity: 0; transform: translateY(0.5rem) rotate(4deg); filter: blur(4px); } }
.mari-work-timeline__timer { display: inline-flex; overflow: hidden; font-variant-numeric: tabular-nums; }
.mari-work-timeline__timer > span { display: inline-block; animation: mari-digit-in 0.35s cubic-bezier(0.16, 1, 0.3, 1) both; }
@keyframes mari-digit-in { from { opacity: 0; transform: translateY(100%); } }
/* Finished: the same line reads "Worked for 14s · 4 steps" and folds the work */
.worked { display: inline-flex; align-items: center; gap: 0.5rem; min-height: 2rem; padding-inline: 0.5rem 0.6rem; border-radius: 999px; color: var(--muted-foreground); font-size: 0.75rem; font-weight: 600; animation: rise-in 0.45s cubic-bezier(0.16, 1, 0.3, 1) both; }
.worked:hover { background: var(--hover); color: var(--foreground); }
.done-mark { width: 0.95rem; height: 0.95rem; fill: none; stroke: oklch(0.74 0.15 154); stroke-linecap: round; stroke-linejoin: round; stroke-width: 1.8; }
.done-mark circle { stroke-dasharray: 51; stroke-dashoffset: 51; animation: mari-stroke-draw 0.5s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
.done-mark path { stroke-dasharray: 14; stroke-dashoffset: 14; animation: mari-stroke-draw 0.35s cubic-bezier(0.16, 1, 0.3, 1) 0.3s forwards; }
@keyframes mari-stroke-draw { to { stroke-dashoffset: 0; } }

/* ─── Buttons (A · Quiet) ─── */
.btn, .link { position: relative; display: inline-flex; align-items: center; justify-content: center; gap: 0.35rem; font-size: 0.8125rem; font-weight: 600; line-height: 1; border-radius: 0.5rem; white-space: nowrap; transition: background-color 0.15s ease, color 0.15s ease, transform 0.12s ease; }
.btn { height: 1.875rem; padding: 0 0.75rem; border: 1px solid var(--hairline); color: var(--strong); }
.btn:hover, .btn.is-pressed { background: var(--hover); }
.btn--solid { background: var(--strong); color: var(--background); border-color: transparent; }
.btn--danger { background: var(--danger-fill); color: #fff; border-color: transparent; }
.link { height: 1.875rem; padding: 0 0.5rem; color: var(--muted-foreground); }
.link:hover, .link.is-pressed { color: var(--strong); background: var(--hover); }
.is-pressed { transform: scale(0.96); }
@media (pointer: coarse) { .btn::after, .link::after { content: ""; position: absolute; inset: -7px -2px; } }
.card { border: 1px solid var(--hairline); border-radius: var(--radius); background: var(--surface); }

/* ─── One card language: a group of hairline rows. Changes, decisions and answers all use it. ─── */
:root, [data-theme="dark"] { --group-bg: color-mix(in srgb, var(--foreground) 3.5%, var(--background)); --divider: color-mix(in srgb, var(--foreground) 8%, transparent); --row-hover: color-mix(in srgb, var(--foreground) 4%, transparent); --group-shadow: none; }
[data-theme="light"] { --group-bg: #fff; --divider: color-mix(in srgb, var(--foreground) 7%, transparent); --row-hover: color-mix(in srgb, var(--foreground) 3%, transparent); --group-shadow: 0 1px 2px rgb(26 16 37 / 0.04), 0 4px 16px -8px rgb(26 16 37 / 0.08); }
.group { border: 1px solid var(--hairline); border-radius: 0.875rem; background: var(--group-bg); box-shadow: var(--group-shadow); overflow: hidden; }
.row + .row { border-top: 1px solid var(--divider); }
.row { animation: rise-in 0.45s cubic-bezier(0.16, 1, 0.3, 1) both; }
.row:nth-child(2) { animation-delay: 0.08s; } .row:nth-child(3) { animation-delay: 0.16s; } .row:nth-child(4) { animation-delay: 0.24s; }
.row-head { display: flex; align-items: center; gap: 0.75rem; width: 100%; min-height: 3.5rem; padding: 0.6rem 0.9rem 0.6rem 0.75rem; text-align: left; transition: background-color 0.15s ease; }
button.row-head:hover, button.row-head.is-hover { background: var(--row-hover); }
.row-text { display: grid; min-width: 0; flex: 1; line-height: 1.35; }
.row-title { display: flex; align-items: center; gap: 0.45rem; min-width: 0; font-size: 0.8125rem; font-weight: 600; color: var(--strong); }
.row-title > span:first-child { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.row-meta { font-size: 0.75rem; color: var(--muted-foreground); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.row-end { display: inline-flex; align-items: center; gap: 0.35rem; flex: none; font-size: 0.75rem; font-weight: 500; color: var(--muted-foreground); font-variant-numeric: tabular-nums; }
.row-end .chev { opacity: 0.8; }
[data-open="true"] > .row-head .chev { transform: rotate(90deg); }
.row-body { padding: 0 0.9rem 0.85rem 3.75rem; display: grid; gap: 0.85rem; }
.row-body .actions { justify-content: flex-end; }
.new { padding: 0.05rem 0.4rem; border-radius: 999px; font-size: 0.625rem; font-weight: 700; letter-spacing: 0.04em; text-transform: uppercase; color: var(--mari-gold-text); background: color-mix(in srgb, var(--mari-workspace-gold) 15%, transparent); }
.kept-end { color: var(--muted-foreground); }
.kept-end svg { color: var(--ok); }
.kept-end svg path { stroke-dasharray: 24; stroke-dashoffset: 24; animation: mari-stroke-draw 0.35s cubic-bezier(0.16, 1, 0.3, 1) 0.1s forwards; }

/* Avatars: quiet duotone tiles with initials, one stable hue per name (the app's no-portrait fallback, calmer) */
.av { display: grid; place-items: center; flex: none; width: 2.25rem; height: 2.25rem; border-radius: 0.625rem; background: oklch(0.34 0.045 calc(var(--h) * 1deg)); color: oklch(0.87 0.07 calc(var(--h) * 1deg)); font-size: 0.75rem; font-weight: 600; letter-spacing: 0.02em; box-shadow: inset 0 0 0 1px color-mix(in srgb, #fff 7%, transparent); }
[data-theme="light"] .av { background: oklch(0.94 0.03 calc(var(--h) * 1deg)); color: oklch(0.44 0.09 calc(var(--h) * 1deg)); box-shadow: inset 0 0 0 1px color-mix(in srgb, #000 5%, transparent); }
.av--risk { --h: 20; }
.av--muted { background: var(--surface-2) !important; color: var(--muted-foreground) !important; }
.av--ok { background: color-mix(in srgb, var(--ok) 14%, transparent) !important; color: var(--ok) !important; }
.av svg { width: 1rem; height: 1rem; }

/* Tracked changes inside the Zylo row */
.fields { display: flex; flex-direction: column; gap: 1rem; }
.field { display: grid; gap: 0.3rem; }
.field-label { font-size: 0.6875rem; font-weight: 600; letter-spacing: 0.04em; text-transform: uppercase; color: var(--muted-foreground); }
.field-text { margin: 0; max-width: 64ch; font-size: 0.8125rem; line-height: 1.6; }
del { color: var(--muted-foreground); text-decoration: line-through; text-decoration-thickness: 1px; }
ins { text-decoration: underline 1px var(--ins-line); text-underline-offset: 3px; background: var(--ins-bg); color: var(--strong); border-radius: 2px; padding: 0 1px; -webkit-box-decoration-break: clone; box-decoration-break: clone; }
.tags { display: flex; flex-wrap: wrap; gap: 0.35rem; }
.tag { display: inline-flex; align-items: center; height: 1.375rem; padding: 0 0.5rem; border-radius: 999px; font-size: 0.6875rem; font-weight: 500; background: var(--surface-2); color: var(--foreground); }
.tag--del { background: none; box-shadow: inset 0 0 0 1px var(--hairline); color: var(--muted-foreground); text-decoration: line-through; }
.tag--del::before { content: "−"; margin-right: 3px; display: inline-block; }
.tag--ins { background: var(--ins-bg); color: var(--strong); }
.tag--ins::before { content: "+"; margin-right: 3px; color: var(--ok); font-weight: 600; }
.greet em { font-style: italic; }
.actions { display: flex; align-items: center; gap: 0.5rem; flex-wrap: wrap; }
.field.reveal { animation: rise-in 0.45s cubic-bezier(0.16, 1, 0.3, 1) both; }
.spacer { flex: 1; }
.check { color: var(--ok); }
.expand { display: grid; grid-template-rows: 0fr; transition: grid-template-rows 0.5s cubic-bezier(0.33, 1, 0.68, 1); }
.expand > div { min-height: 0; overflow: hidden; }
[data-open="true"] > .expand { grid-template-rows: 1fr; }

/* Maren's card, inside her row */
.preview-desc { margin: 0; font-size: 0.8125rem; line-height: 1.6; color: var(--foreground); }
.facts { display: flex; flex-wrap: wrap; gap: 0.25rem 1.1rem; margin: 0; font-size: 0.75rem; }
.facts div { display: flex; gap: 0.35rem; } .facts dt { color: var(--muted-foreground); } .facts dd { margin: 0; color: var(--foreground); }
[data-open="true"] .row-body > * { animation: rise-in 0.45s cubic-bezier(0.16, 1, 0.3, 1) both; }
[data-open="true"] .row-body > :nth-child(2) { animation-delay: 0.05s; } [data-open="true"] .row-body > :nth-child(3) { animation-delay: 0.1s; } [data-open="true"] .row-body > :nth-child(4) { animation-delay: 0.15s; }

/* Decisions: same rows; the reason and the two buttons sit under the title */
.decision .row-head { align-items: flex-start; min-height: 0; padding-bottom: 0.25rem; }
.decision .row-body { padding-top: 0.1rem; gap: 0.6rem; }
.reason { margin: 0; font-size: 0.8125rem; line-height: 1.55; color: var(--muted-foreground); max-width: 60ch; }
.row.resolved { animation: none; }
.row.resolved .row-head { min-height: 3rem; }
.row.resolved .row-title { font-weight: 500; color: var(--foreground); }
.tech > summary { list-style: none; display: inline-flex; align-items: center; gap: 0.35rem; font-size: 0.75rem; font-weight: 600; color: var(--muted-foreground); min-height: 1.75rem; padding: 0 0.4rem; margin-left: -0.4rem; border-radius: 0.4rem; cursor: pointer; }
.tech > summary::-webkit-details-marker { display: none; }
.tech > summary:hover { background: var(--hover); color: var(--strong); }
.tech dl { margin: 0.35rem 0 0; display: grid; grid-template-columns: max-content 1fr; gap: 0.2rem 1rem; font-size: 0.75rem; }
.tech dt { color: var(--muted-foreground); } .tech dd { margin: 0; }
code { font: 0.75rem/1.5 ui-monospace, "JetBrains Mono", Consolas, monospace; }
.note { margin: 0; display: flex; align-items: center; gap: 0.45rem; min-height: 1.9rem; font-size: 0.8125rem; color: var(--muted-foreground); }
.swap-out { animation: swap-out 0.24s ease forwards; }
@keyframes swap-out { to { opacity: 0; } }

/* A name you can hover for its card */
.mention { color: inherit; text-decoration: underline dotted 1.5px color-mix(in srgb, var(--foreground) 40%, transparent); text-underline-offset: 4px; cursor: default; border-radius: 3px; transition: background-color 0.15s ease; }
.mention:hover, .mention.is-hover { background: var(--hover); text-decoration-color: var(--foreground); }
.hovercard { position: fixed; z-index: 250; width: 18.5rem; border: 1px solid var(--hairline); border-radius: 0.875rem; background: linear-gradient(var(--group-bg), var(--group-bg)) var(--background); box-shadow: 0 1rem 2.5rem -0.75rem rgb(0 0 0 / 0.5); overflow: hidden; transform-origin: 30% 100%; animation: pop-in 0.18s cubic-bezier(0.16, 1, 0.3, 1) both; }
[data-theme="light"] .hovercard { box-shadow: 0 1rem 2.5rem -0.75rem rgb(40 20 60 / 0.22); }
.hovercard .row-head { min-height: 3.25rem; }
.hovercard .row-body { padding-left: 0.9rem; gap: 0.5rem; }
.hovercard.leaving { animation: pop-out 0.14s ease forwards; }
@keyframes pop-in { from { opacity: 0; transform: translateY(4px) scale(0.97); } }
@keyframes pop-out { to { opacity: 0; transform: translateY(2px) scale(0.98); } }
.hc-quote { margin: 0; font-size: 0.8125rem; line-height: 1.55; color: var(--foreground); }

/* Satisfying, small */
.steps summary > svg:first-child { animation: done-flash 1.4s ease both; }
@keyframes done-flash { 0%, 35% { color: var(--ok); } }
.field.reveal ins { background: linear-gradient(var(--ins-bg), var(--ins-bg)) no-repeat 0 0 / 100% 100%; animation: ins-wipe 0.7s cubic-bezier(0.33, 1, 0.68, 1) 0.35s both; }
@keyframes ins-wipe { from { background-size: 0% 100%; } }
.tag--ins { animation: rise-in 0.4s cubic-bezier(0.16, 1, 0.3, 1) both; } .tag--ins:nth-child(5) { animation-delay: 0.08s; } .tag--ins:nth-child(6) { animation-delay: 0.16s; }
.worked { position: relative; }
.worked .burst { position: absolute; left: 0.03rem; top: 50%; width: 2rem; height: 2rem; margin-top: -1rem; pointer-events: none; background: radial-gradient(circle, var(--mari-workspace-gold) 0 1.5px, transparent 2px) 50% 50% / 34% 34%; mask-image: radial-gradient(circle, transparent 28%, #000 30%, #000 60%, transparent 62%); opacity: 0; animation: mari-sprite-puff 0.8s cubic-bezier(0.16, 1, 0.3, 1) 0.35s; }
.opt[data-picked="true"] { animation: pick-pop 0.35s cubic-bezier(0.34, 1.56, 0.64, 1); }
@keyframes pick-pop { 40% { transform: scale(0.985); } }
.next-card:hover, .next-card.is-hover { transform: translateY(-1px); }
.next-card:active { transform: scale(0.98); }

/* ─── A follow-up question: her last line, then the answers as soft rows ─── */
.ask { display: grid; gap: 0.6rem; }
.ask-q { display: flex; align-items: flex-start; gap: 0.45rem; margin: 0; max-width: 42rem; color: var(--strong); font-weight: 600; }
.ask-q svg { margin-top: 0.22rem; color: var(--primary); filter: drop-shadow(0 0 0.4rem color-mix(in srgb, var(--primary) 35%, transparent)); }
.ask .expand > div { display: block; }
.ask[data-open="false"] { gap: 0; }
.ask[data-open="false"] .expand { grid-template-rows: 0fr; }
.ask[data-open="true"] .expand, .ask:not([data-open]) .expand { grid-template-rows: 1fr; }
.ask .group { max-width: 36rem; }
.opt { display: flex; align-items: center; gap: 0.75rem; width: 100%; min-height: 3.25rem; padding: 0.55rem 0.9rem 0.55rem 0.75rem; text-align: left; transition: background-color 0.15s ease, opacity 0.25s ease; }
.opt + .opt { border-top: 1px solid var(--divider); }
.opt:hover, .opt.is-hover { background: var(--row-hover); }
.opt kbd { display: inline-grid; place-items: center; flex: none; width: 2.25rem; height: 2.25rem; border-radius: 0.625rem; background: var(--surface-2); font: 600 0.75rem/1 var(--font-y2k); color: var(--muted-foreground); transition: background-color 0.2s ease, color 0.2s ease; }
.opt b { display: block; font-size: 0.8125rem; font-weight: 600; color: var(--strong); line-height: 1.35; }
.opt small { display: block; font-size: 0.75rem; color: var(--muted-foreground); line-height: 1.4; }
.opt--other { min-height: 2.75rem; color: var(--muted-foreground); font-size: 0.8125rem; }
.opt--other kbd { background: none; }
.opt[data-picked="true"] { background: color-mix(in srgb, var(--ok) 8%, transparent); }
.opt[data-picked="true"] kbd { background: var(--ok); color: var(--background); }
.opt[data-dimmed="true"] { opacity: 0.4; }

/* An older turn keeps only its "Worked for" line; Mari stands on the newest one */
.mari-work-timeline__live.is-past { min-height: 2rem; }
.mari-work-timeline__live.is-past .mari-live-work__sprite { display: none; }

/* Waiting on you: the live line rests, no sheen, no timer */
.mari-work-timeline__live.is-resting .mari-work-timeline__line { mask-image: none; animation: none; }
.mari-work-timeline__live.is-resting .mari-work-timeline__phrase { color: var(--muted-foreground); font-size: 0.8125rem; }

/* ─── Next steps: small cards above the composer (today: tinted chips) ─── */
.next { display: flex; gap: 0.5rem; margin: 0 0 0.6rem; overflow-x: auto; scrollbar-width: none; scroll-snap-type: x mandatory; scroll-padding-inline: 0.125rem; padding: 0.125rem; }
.next::-webkit-scrollbar { display: none; }
.next[hidden] { display: none; }
.next-card { position: relative; display: flex; flex: 1 1 0; min-width: 12.5rem; max-width: 15rem; align-items: center; gap: 0.65rem; padding: 0.5rem 0.8rem 0.5rem 0.5rem; border: 1px solid var(--hairline); border-radius: 0.875rem; background: var(--group-bg); box-shadow: var(--group-shadow); text-align: left; scroll-snap-align: start; animation: rise-in 0.45s cubic-bezier(0.16, 1, 0.3, 1) both; transition: background-color 150ms ease, border-color 150ms ease, transform 120ms ease; }
.next-card:hover, .next-card.is-hover { border-color: color-mix(in srgb, var(--foreground) 22%, transparent); }
.next-card .av { width: 2rem; height: 2rem; border-radius: 0.55rem; font-size: 0.6875rem; }
.next-card b { display: block; font-size: 0.75rem; font-weight: 600; line-height: 1.3; color: var(--strong); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.next-card small { display: block; font-size: 0.6875rem; line-height: 1.35; color: var(--muted-foreground); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.next-card > span:last-child { min-width: 0; }

/* ─── Composer dock + her state glow (globals.css, verbatim) ─── */
@property --mari-glow-a { syntax: "<color>"; inherits: true; initial-value: transparent; }
@property --mari-glow-b { syntax: "<color>"; inherits: true; initial-value: transparent; }
@property --mari-glow-c { syntax: "<color>"; inherits: true; initial-value: transparent; }
.mari-workspace-composer-dock { --mari-glow-a: var(--mari-logo-pink); --mari-glow-b: var(--mari-logo-orange); --mari-glow-c: var(--mari-logo-cyan); position: relative; isolation: isolate; flex: none; padding: 0.75rem 1.75rem calc(0.75rem + env(safe-area-inset-bottom)); transition: --mari-glow-a 0.9s ease, --mari-glow-b 0.9s ease, --mari-glow-c 0.9s ease; }
.mari-workspace-composer-dock[data-glow="thinking"] { --mari-glow-a: var(--mari-logo-cyan); --mari-glow-b: oklch(0.68 0.16 280); --mari-glow-c: var(--mari-logo-pink); }
.mari-workspace-composer-dock[data-glow="writing"] { --mari-glow-a: var(--mari-logo-pink); --mari-glow-b: var(--mari-logo-orange); --mari-glow-c: var(--mari-workspace-gold); }
.mari-workspace-composer-dock[data-glow="waiting-approval"] { --mari-glow-a: var(--mari-workspace-gold); --mari-glow-b: var(--mari-logo-orange); --mari-glow-c: var(--mari-workspace-gold); }
.mari-workspace-composer-dock[data-glow="broken"] { --mari-glow-a: var(--destructive); --mari-glow-b: oklch(0.6 0.2 25); --mari-glow-c: var(--destructive); }
.mari-workspace-composer-dock[data-working="ending"] { --mari-glow-a: oklch(0.74 0.16 151); --mari-glow-b: oklch(0.8 0.14 170); --mari-glow-c: oklch(0.74 0.16 151); }
.mari-workspace-composer-dock::before, .mari-workspace-composer-dock::after { position: absolute; z-index: -1; left: 50%; bottom: -55%; width: max(100vw, 48rem); border-radius: 50%; content: ""; pointer-events: none; translate: -50% 0; transform-origin: 50% 100%; opacity: 0; transition: opacity 0.6s ease; }
.mari-workspace-composer-dock::before { height: 130%; background: linear-gradient(90deg, var(--mari-glow-a), var(--mari-glow-b) 25%, var(--mari-glow-c) 50%, var(--mari-glow-a) 75%, var(--mari-glow-b)); filter: blur(2rem); }
.mari-workspace-composer-dock::after { height: 110%; background: radial-gradient(closest-side at 20% 60%, color-mix(in srgb, var(--mari-glow-c) 75%, transparent), transparent), radial-gradient(closest-side at 50% 70%, color-mix(in srgb, var(--mari-glow-a) 70%, transparent), transparent), radial-gradient(closest-side at 80% 60%, color-mix(in srgb, var(--mari-glow-b) 75%, transparent), transparent); filter: blur(1.5rem); }
.mari-workspace-composer-dock[data-working="true"]::before { opacity: 0.65; animation: mari-glow-waver 4.2s ease-in-out infinite alternate; }
.mari-workspace-composer-dock[data-working="true"]::after { opacity: 0.55; animation: mari-glow-drift 5.5s ease-in-out infinite alternate; }
.mari-workspace-composer-dock[data-working="ending"]::before, .mari-workspace-composer-dock[data-working="ending"]::after { animation: mari-glow-settle 6.5s cubic-bezier(0.45, 0, 0.55, 1) forwards; }
.mari-workspace-composer-dock[data-glow="broken"]:not([data-working])::before { animation: mari-glow-alert 8s cubic-bezier(0.45, 0, 0.55, 1) forwards; }
.mari-workspace-composer-dock[data-glow="waiting-approval"]:not([data-working])::before { opacity: 0.35; scale: 1 0.55; animation: mari-glow-waver-soft 4s ease-in-out infinite alternate; }
@keyframes mari-glow-waver { 0% { scale: 1 0.88; } 50% { scale: 1.01 1.08; translate: -50.4% 0; } 100% { scale: 1 0.94; translate: -49.6% 0; } }
@keyframes mari-glow-waver-soft { from { scale: 1 0.5; } to { scale: 1.02 0.6; } }
@keyframes mari-glow-drift { from { translate: -51.5% 0; scale: 0.98 0.9; } to { translate: -48.5% 0; scale: 1.02 1.1; } }
@keyframes mari-glow-settle { 0% { opacity: 0.65; scale: 1 0.95; } 30% { opacity: 0.6; scale: 1 0.8; } 100% { opacity: 0; scale: 1 0.15; } }
@keyframes mari-glow-alert { 0% { opacity: 0.5; scale: 1 0.7; } 35% { opacity: 0.4; scale: 1 0.6; } 100% { opacity: 0; scale: 1 0.25; } }

.shell { position: relative; display: flex; align-items: center; gap: 0.5rem; min-height: 3.5rem; padding: 0.625rem 1rem; border: 1px solid color-mix(in srgb, var(--marinara-app-accent-solid) 24%, var(--border)); border-radius: 1rem; background: color-mix(in srgb, var(--marinara-app-accent-solid) 4%, var(--marinara-chat-chrome-input-bg)); box-shadow: inset 0 1px 0 color-mix(in srgb, var(--foreground) 5%, transparent), 0 0.35rem 1rem color-mix(in srgb, var(--marinara-app-accent-solid) 8%, transparent); backdrop-filter: blur(12px); container-type: inline-size; transition: background-color 0.35s ease, border-color 0.35s ease, box-shadow 0.35s ease; }
[data-theme="light"] .shell { background: color-mix(in srgb, var(--marinara-app-accent-solid) 3%, var(--card)); box-shadow: inset 0 1px 0 color-mix(in srgb, var(--foreground) 4%, transparent); }
.shell > * { transition: opacity 0.3s ease 0.15s; }
.shell[data-collapsed="true"] { border-color: transparent; background: transparent; box-shadow: none; backdrop-filter: none; }
.shell[data-collapsed="true"] > :not(.send) { opacity: 0; pointer-events: none; transition-delay: 0s; }
.cbtn { position: relative; display: inline-grid; place-items: center; width: 2rem; height: 2rem; flex: none; border-radius: 0.75rem; color: color-mix(in srgb, var(--marinara-chat-chrome-accent) 58%, transparent); }
.cbtn:hover { background: var(--marinara-chat-chrome-highlight-bg-hover); color: var(--marinara-chat-chrome-button-text-hover); }
.cbtn--conn { color: color-mix(in srgb, var(--foreground) 40%, transparent); }
.cbtn--conn::after { position: absolute; top: 0.15rem; right: 0.1rem; width: 0.42rem; height: 0.42rem; border: 1px solid var(--card); border-radius: 999px; content: ""; background: color-mix(in srgb, oklch(0.74 0.16 151) 45%, var(--muted-foreground)); }
.ctx-chip { display: inline-flex; min-width: 0; max-width: 18rem; align-items: center; gap: 0.35rem; flex: none; border: 1px solid color-mix(in srgb, var(--primary) 25%, transparent); border-radius: 0.375rem; background: color-mix(in srgb, var(--primary) 8%, transparent); padding: 0.25rem 0.3rem 0.25rem 0.5rem; font-size: 0.6875rem; color: var(--foreground); transition: opacity 0.25s ease, max-width 0.3s ease; }
.ctx-chip svg { color: var(--primary); }
.ctx-chip .x { display: inline-grid; place-items: center; width: 1.25rem; height: 1.25rem; border-radius: 0.25rem; color: var(--muted-foreground); }
.ctx-chip[hidden] { display: none; }
.field-input { position: relative; min-width: 0; flex: 1; font-size: 0.9375rem; line-height: 1.5; color: var(--foreground); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; direction: ltr; }
.field-input:empty::before { content: attr(data-placeholder); color: var(--muted-foreground); }

  const out = [];
  for (const part of src.split(/(\*\*[^*]+\*\*|\*[^*]+\*)/)) {
    if (!part) continue;
    const strong = part.startsWith("**"), em = !strong && part.startsWith("*");
    const text = strong ? part.slice(2, -2) : em ? part.slice(1, -1) : part;
    for (const w of text.split(/(?<=\s)/)) out.push(strong ? `<strong>${w.trimEnd()}</strong>${w.endsWith(" ") ? " " : ""}` : em ? `<em>${w.trimEnd()}</em>${w.endsWith(" ") ? " " : ""}` : w);
  }
  return out;
}

/* ───────────── clock: a scripted timeline that honours pause and speed ───────────── */
const S = { t: 0, speed: Number(params.get("speed")) === 2 ? 2 : 1, paused: false, frozen: false, events: [], tasks: [], ei: 0, seeking: false };
const at = (t, fn) => S.events.push({ t, fn });
// Under reduced motion a text task lands whole; a clock task (the timer) still counts.
const span = (t0, dur, fn, instantWhenReduced = true) => S.tasks.push({ t0, t1: t0 + dur, fn, done: false, rm: instantWhenReduced });

function step(dt) {
  S.t += dt;
  while (S.ei < S.events.length && S.events[S.ei].t <= S.t) S.events[S.ei++].fn();
  for (const k of S.tasks) {
    if (k.done || S.t < k.t0) continue;
    const p = RM && k.rm ? 1 : Math.min(1, (S.t - k.t0) / (k.t1 - k.t0));
    k.fn(p);
    if (p >= 1) k.done = true;
  }
}

/* ───────────── state ───────────── */
let D; // live DOM refs for one run
const nextRow = $("#next");
let hovercard = null;
const stack = $("#stack"), transcript = $("#transcript"), dock = $("#dock"), shell = $("#shell"), send = $("#send"), input = $("#input"), chip = $("#chip");
const portrait = $("#portrait"), portraitGlow = $("#portrait-glow"), status = $("#status"), cursor = $("#cursor");
let follow = true, scrollGoal = null;

function reset() {
  S.t = 0; S.ei = 0; S.tasks.forEach((k) => (k.done = false));
  stack.innerHTML = `
    <div class="welcome" id="welcome">

    </div>`;

function setHeader(state) {

}

/* Composer */
function typeInto(t0, text, dur) {
  span(t0, dur, (p) => {
    const n = Math.round(text.length * p);
    input.innerHTML = "";
    input.append(text.slice(0, n));
    if (p < 1 || !S.seeking) input.insertAdjacentHTML("beforeend", '<span class="caret"></span>');
    input.scrollLeft = input.scrollWidth;
    send.dataset.ready = n > 0 ? "true" : "false";
  });
}
function sendMessage(text, { facet } = {}) {
  const from = input.getBoundingClientRect();
  input.textContent = ""; send.dataset.ready = "false";
  $("#welcome")?.remove();
  const turn = el(`<div class="mari-user-request"><div class="mari-user-request__bubble">${text}</div>${facet ? `<span class="facet enter">${ic.user}${facet}</span>` : ""}</div>`);
  stack.append(turn);
  follow = true;
  // Your words lift out of the composer into the transcript.
  if (!S.seeking && !RM) {
    transcript.scrollTop = transcript.scrollHeight;
    const b = turn.firstElementChild, to = b.getBoundingClientRect();
    b.animate([{ transform: `translate(${from.left - to.left}px, ${from.top - to.top}px) scale(0.98)`, opacity: 0.35 }, { transform: "none", opacity: 1 }], { duration: 520, easing: "cubic-bezier(0.16, 1, 0.3, 1)" });
  }
  return turn;
}

/* Mari's turn */
function startTurn() {
  stack.querySelectorAll(".mari-work-timeline__live").forEach((n) => n.classList.add("is-past"));
  D.turn = el(`<article class="mari-turn" aria-label="Professor Mari" aria-busy="true"><div class="flow"></div>
    <div class="mari-work-timeline__live" role="status"><span class="mari-live-work__sprite" data-role="working"></span><span class="mari-work-timeline__phrase"></span><span class="mari-work-timeline__timer"></span></div></article>`);
  D.flow = D.turn.querySelector(".flow");
  D.live = D.turn.querySelector(".mari-work-timeline__live");
  D.sprite = D.live.querySelector(".mari-live-work__sprite");
  D.phrase = D.live.querySelector(".mari-work-timeline__phrase");
  D.timer = D.live.querySelector(".mari-work-timeline__timer");
  D.scene = null; D.secs = -1; D.steps = null; D.ended = false; D.phraseKey = null;
  stack.append(D.turn);
}
function setScene(scene, { hop = true } = {}) {
  if (!hop && D.scene === scene) return;
  D.scene = scene;
  D.sprite.innerHTML = `<span style="--mari-work-sprite:url(img/story-${scene}.png)"></span>`;
  if (!hop) D.sprite.dataset.rest = "true"; else delete D.sprite.dataset.rest;
}
function setPhrase(text, subject) {
  const key = text + "|" + (subject || "");
  if (D.phraseKey === key) return;
  D.phraseKey = key;
  D.phrase.querySelectorAll(".mari-work-timeline__line").forEach((n) => { n.classList.add("leaving"); setTimeout(() => n.remove(), 400); });
  const letters = (v, off) => [...v].map((c, i) => `<span class="mari-work-timeline__char" style="--i:${Math.min(off + i, 40)}">${c}</span>`).join("");
  D.phrase.insertAdjacentHTML("beforeend", `<span class="mari-work-timeline__line"><span class="sr-only">${subject ? text + " " + subject : text}</span><span aria-hidden="true">${letters(text, 0)}${subject ? `<span class="mari-work-timeline__subject-text">${letters(" " + subject, text.length)}</span>` : ""}</span></span>`);
}
function setTimer(s) {
  if (s === D.secs) return;
  const prev = String(Math.max(D.secs, 0)) + "s", next = String(s) + "s";
  D.secs = s;
  // Only the digit that changed rolls in.
  D.timer.innerHTML = [...next].map((c, i) => `<span${prev.length === next.length && prev[i] === c ? ' style="animation:none"' : ""}>${c}</span>`).join("");
  D.timer.setAttribute("aria-label", `${s}s elapsed`);
}
function stream(t0, text, { perWord = 0.075, cls = "md" } = {}) {
  const toks = words(text);
  let p_el, shown = 0;
  span(t0, toks.length * perWord, (p) => {
    if (!p_el) { p_el = el(`<p class="${cls}"></p>`); D.flow.append(p_el); D.steps = null; }
    const n = Math.round(toks.length * p);
    if (n > shown) {
      p_el.querySelector(".mari-stream-caret")?.remove();
      for (; shown < n; shown++) p_el.insertAdjacentHTML("beforeend", `<span class="mari-stream-word">${toks[shown]}</span>`);
      if (p < 1) p_el.insertAdjacentHTML("beforeend", '<span class="mari-stream-caret" aria-hidden="true"></span>');
    }
    if (p >= 1) p_el.querySelector(".mari-stream-caret")?.remove();
  });
  return t0 + toks.length * perWord;
}
function addStep(s) {
  if (!D.steps) { D.steps = el('<div class="steps"></div>'); D.flow.append(D.steps); }
  D.steps.append(el(`<details class="enter"><summary>${s.icon}<span>${s.done} <span class="q">${s.q}</span></span><span class="dur">${s.dur}</span>${ic.chev}</summary><div class="step-detail">${s.detail}</div></details>`));
}
// One block turns into another: the old one fades, the new one grows from the old height.
function morph(oldEl, html) {
  const h0 = oldEl.offsetHeight, n = el(html);
  oldEl.replaceWith(n);
  if (!S.seeking && !RM) {
    const h1 = n.offsetHeight;
    n.style.overflow = "hidden";
    n.animate([{ height: `${h0}px`, opacity: 0 }, { height: `${h1}px`, opacity: 1 }], { duration: 420, easing: "cubic-bezier(0.16, 1, 0.3, 1)" }).onfinish = () => (n.style.overflow = "");
  }
  return n;
}
function showHover(anchor, key) {
  hideHover(true);
  const e = ENT[key];
  hovercard = el(`<div class="hovercard" role="tooltip"><div class="row-head">${av(e)}<span class="row-text"><span class="row-title"><span>${e.name}</span></span><span class="row-meta">${e.meta}</span></span></div><div class="row-body"><p class="hc-quote">“${e.quote}”</p><span class="row-meta">${e.edited}</span></div></div>`);
  document.body.append(hovercard);
  hovercard.anchor = anchor;
  placeHover();
}
function placeHover() {
  if (!hovercard) return;
  const r = hovercard.anchor.getBoundingClientRect(), w = hovercard.offsetWidth, h = hovercard.offsetHeight;
  hovercard.style.left = `${Math.max(12, Math.min(innerWidth - w - 12, r.left - 8))}px`;
  hovercard.style.top = `${r.top - h - 10 > 70 ? r.top - h - 10 : r.bottom + 10}px`;
}
function hideHover(now) {
  if (!hovercard) return;
  const n = hovercard; hovercard = null;
  if (now || S.seeking || RM) n.remove(); else { n.classList.add("leaving"); setTimeout(() => n.remove(), 200); }
}
function addBlock(html) { const n = el(html); n.classList.add("enter"); D.flow.append(n); D.steps = null; return n; }
function setOpen(node, open) { node.dataset.open = String(open); node.querySelector("[aria-expanded]")?.setAttribute("aria-expanded", String(open)); }

/* One run of hers: the bar steps aside for Stop, the glow wakes, the header says she works. */
function beginRun() {
  nextRow.hidden = true;
  shell.dataset.collapsed = "true";
  send.dataset.mode = "stop"; send.setAttribute("aria-label", "Stop");
  dock.dataset.working = "true"; dock.dataset.glow = "thinking";
  setHeader("working");
}
function runTimer(t0, len, secs) {
  span(t0, len, (p) => D.timer?.isConnected && !D.ended && setTimer(Math.floor(p * secs)), false);
}
function giveBarBack() {
  shell.removeAttribute("data-collapsed");
  send.dataset.mode = "send"; send.setAttribute("aria-label", "Send");
}
// Done: success story, the line reads "Worked for …" and folds the work; green glow sinks.
function finishTurn(label, secs, pending = false) {
  setTimer(secs);
  D.ended = true;
  const turn = D.turn;
  turn.setAttribute("aria-busy", "false");
  setScene("success");
  D.sprite.dataset.role = "rest";
  D.phrase.outerHTML = `<button class="worked" type="button" aria-expanded="true"><span class="burst" aria-hidden="true"></span>${doneMark}<span>${label}</span>${ic.chev}</button>`;
  D.timer.remove();
  turn.querySelector(".worked").addEventListener("click", (e) => { const open = e.currentTarget.getAttribute("aria-expanded") === "true"; e.currentTarget.setAttribute("aria-expanded", String(!open)); turn.classList.toggle("turn-folded", open); });
  dock.dataset.working = "ending";
  giveBarBack();
  setHeader(pending ? "needs" : "idle");
}
// She asked you something: the run pauses on the approval story, the bar comes back for a typed answer.
function waitForAnswer() {
  D.ended = true;
  D.turn.setAttribute("aria-busy", "false");
  setScene("approval");
  D.sprite.dataset.role = "rest";
  D.timer.remove();
  D.live.classList.add("is-resting");
  setPhrase("Waiting for your answer");
  dock.removeAttribute("data-working"); dock.dataset.glow = "waiting-approval";

  input.dataset.placeholder = "Or type your own answer";
  setHeader("needs");
}

/* The demo pointer */
function pointAt(target) {
  D.pointed?.classList.remove("is-hover");
  D.pointed = target;
  target.classList.add("is-hover");
  const r = target.getBoundingClientRect();
  const x = r.left + r.width * 0.5, y = r.top + r.height * 0.55;
  cursor.classList.add("on");
  cursor.style.transform = `translate(${x}px, ${y}px)`;
}
function press(target) {
  // Jumping to a moment: land the end state now, never from a timer that fires after the jump.
  if (S.seeking) { cursor.classList.remove("on"); target.classList.remove("is-hover"); return; }
  cursor.classList.add("press"); target.classList.add("is-pressed");
  setTimeout(() => { cursor.classList.remove("press"); target.classList.remove("is-pressed"); }, 180 / S.speed);
  setTimeout(() => { target.classList.remove("is-hover"); if (D.pointed === target) cursor.classList.remove("on"); }, 700 / S.speed);
}
function reveal(target, at = 0.62, force = false) {
  follow = false;
  const tr = transcript.getBoundingClientRect(), r = target.getBoundingClientRect();
  if (force || r.top < tr.top + 24 || r.bottom > tr.bottom - 24) scrollGoal = transcript.scrollTop + (r.top - tr.top) - tr.height * at;
}

/* ───────────── the script (seconds at 1×) ───────────── */
function build() {
  S.events = []; S.tasks = []; S.marks = {};
  const RUN0 = 3.1, RUN1 = 22.2;         // what the timer counts: 0s → 14s
  let T;

  typeInto(0.6, ASK, 2.1);
  at(3.0, () => {
    D.user = sendMessage(ASK, { facet: "Zylo Vantrell" });
    chip.hidden = true;
    beginRun();
  });
  at(RUN0, () => { startTurn(); setScene("thinking"); setPhrase("Reading your message"); setTimer(0); });
  runTimer(RUN0, RUN1 - RUN0, 14);

  // She thinks, then says what she is about to do.
  at(4.5, () => { addBlock(`<button class="thought" type="button" aria-expanded="false">${ic.star}<span>Thought for 1s</span>${ic.chev}</button>`); setPhrase("Putting it into words"); dock.dataset.glow = "writing"; });
  T = stream(4.7, TEXT.intro);

  // Four steps: the running one is the live line; a finished one becomes a quiet line above it.
  T += 0.35;
  STEPS.forEach((s, i) => {
    const start = T, len = [1.7, 1.9, 1.9, 1.6][i];
    if (i === 1) S.marks.working = start + 0.9;
    at(start, () => { dock.dataset.glow = "thinking"; setScene(s.scene); setPhrase(s.live, s.q); });
    at(start + len, () => addStep(s));
    T = start + len + 0.12;
  });

  // Her answer, then one card with everything she changed, then one card with what she needs from you.
  at(T, () => { dock.dataset.glow = "writing"; setScene("editing", { hop: false }); setPhrase("Putting it into words"); });
  S.marks.streaming = T + 1.3;
  T = stream(T + 0.1, TEXT.done, { perWord: 0.06 });
  T = stream(T + 0.15, TEXT.ketch, { perWord: 0.06 });
  const M = ENT.maren;
  at(T + 0.2, () => {
    D.changes = addBlock(`<section class="group" aria-label="Changes">
      <div class="row" data-row="zylo" data-open="false">
        <button class="row-head" type="button" aria-expanded="false">${av(ENT.zylo)}<span class="row-text"><span class="row-title"><span>Zylo Vantrell</span></span><span class="row-meta">Character · description, tags, greeting</span></span><span class="row-end" data-end>3 changes${ic.chev}</span></button>
        <div class="expand"><div><div class="row-body"><div class="fields">${fieldsHTML}</div><div class="actions"><button class="link" type="button">${ic.undo}Undo</button><button class="btn" type="button" data-keep>Keep</button></div></div></div></div>
      </div>
      <div class="row" data-row="maren" data-open="false">
        <button class="row-head" type="button" aria-expanded="false">${av(M)}<span class="row-text"><span class="row-title"><span>${M.name}</span><span class="new">New</span></span><span class="row-meta">${M.sub}</span></span><span class="row-end">${ic.chev}</span></button>
        <div class="expand"><div><div class="row-body"><p class="preview-desc">${M.desc}</p><div class="tags">${M.tags.map((t) => `<span class="tag">${t}</span>`).join("")}</div>
          <dl class="facts">${M.facts.map(([k, v]) => `<div><dt>${k}</dt><dd>${v}</dd></div>`).join("")}</dl>
          <div class="actions"><button class="link" type="button">Open</button><button class="btn btn--solid" type="button">${ic.chat}Start chat</button></div></div></div></div>
      </div></section>`);
    D.zylo = D.changes.querySelector('[data-row="zylo"]'); D.maren = D.changes.querySelector('[data-row="maren"]');
    setPhrase("Showing you the changes");
  });
  at(T + 1.0, () => { setOpen(D.zylo, true); D.zylo.querySelectorAll(".field").forEach((f, i) => { f.classList.add("reveal"); f.style.animationDelay = `${0.12 + i * 0.12}s`; }); });
  S.marks.changes = T + 2.6;
  T += 2.8;
  at(T, () => setPhrase("Waiting for your answer"));
  T = stream(T + 0.05, TEXT.ask, { perWord: 0.06 });
  at(T + 0.2, () => {
    D.decide = addBlock(`<section class="group" aria-label="Needs your answer">
      <div class="row decision" data-row="del">
        <div class="row-head">${avIcon(ic.trash, "av--risk", 20)}<span class="row-text"><span class="row-title"><span>Delete <span class="mention" tabindex="0" data-ent="market">Floating Market</span></span></span><span class="row-meta">Lorebook · 42 entries · used in 3 chats</span></span></div>
        <div class="row-body"><p class="reason">Its entries say the market is abandoned, which contradicts Zylo. You can’t undo this.</p><div class="actions"><button class="link" type="button" data-keep-it>Keep it</button><button class="btn btn--danger" type="button">Delete</button></div></div>
      </div>
      <div class="row decision" data-row="inst">
        <div class="row-head">${avIcon(ic.pkg, "av--muted")}<span class="row-text"><span class="row-title"><span>Install dayjs</span></span><span class="row-meta">Package · 7 KB · MIT · no install scripts</span></span></div>
        <div class="row-body"><p class="reason">His Market clock tool needs it to keep in-world time. Packages run code on your Marinara server.</p>
          <details class="tech"><summary>${ic.chev}Technical details</summary><dl><dt>Version</dt><dd>1.11.13</dd><dt>Source</dt><dd>registry.npmjs.org</dd><dt>Runs</dt><dd><code>pnpm add dayjs@1.11.13</code></dd></dl></details>
          <div class="actions"><button class="link" type="button" data-not-now>Not now</button><button class="btn btn--solid" type="button">Install</button></div></div>
      </div></section>`);
    D.del = D.decide.querySelector('[data-row="del"]'); D.inst = D.decide.querySelector('[data-row="inst"]');
  });

  // The run ends: success story, then she rests; the glow turns green and sinks, Stop gives the bar back.
  const END = Math.max(T + 1.3, RUN1);
  at(END, () => finishTurn("Worked for 14s · 4 steps", 14, true));
  S.marks.finished = END + 1.3;
  at(END + 5.0, () => setScene("idle", { hop: false }));
  at(END + 3.2, () => { dock.removeAttribute("data-working"); dock.dataset.glow = "waiting-approval"; });

  // The demo answers: keep the edit.
  const resolved = (icon, title, meta, end = "", tone = "av--ok") => `<div class="row resolved"><div class="row-head">${avIcon(icon, tone)}<span class="row-text"><span class="row-title"><span>${title}</span></span><span class="row-meta">${meta}</span></span>${end}</div></div>`;
  let C = END + 1.6;
  at(C, () => reveal(D.zylo.querySelector("[data-keep]")));
  at(C + 0.7, () => pointAt(D.zylo.querySelector("[data-keep]")));
  at(C + 1.5, () => press(D.zylo.querySelector("[data-keep]")));
  at(C + 1.75, () => { setOpen(D.zylo, false); D.zylo.querySelector("[data-end]").innerHTML = `<span class="kept-end">${keptMark} Kept</span>${ic.chev}`; reveal(D.changes, 0.3, true); });
  // Open the new character.
  C += 2.4;
  at(C + 0.3, () => pointAt(D.maren.querySelector(".row-head")));
  at(C + 1.0, () => press(D.maren.querySelector(".row-head")));
  at(C + 1.15, () => setOpen(D.maren, true));
  S.marks.preview = C + 2.3;
  // Before deciding, look at what would be deleted.
  C += 3.2;
  at(C, () => reveal(D.decide, 0.5, true));
  at(C + 0.7, () => pointAt(D.del.querySelector(".mention")));
  at(C + 1.0, () => showHover(D.del.querySelector(".mention"), "market"));
  S.marks.hovercard = C + 1.9;
  at(C + 2.9, () => { hideHover(); pointAt(D.del.querySelector("[data-keep-it]")); });
  at(C + 3.6, () => press(D.del.querySelector("[data-keep-it]")));
  at(C + 3.8, () => D.del.classList.add("swap-out"));
  at(C + 4.05, () => (D.del = morph(D.del, resolved(keptMark, "Kept Floating Market", "It still says the market is abandoned"))));
  // And not the package, for now.
  C += 4.6;
  at(C + 0.2, () => pointAt(D.inst.querySelector("[data-not-now]")));
  at(C + 0.9, () => press(D.inst.querySelector("[data-not-now]")));
  at(C + 1.1, () => D.inst.classList.add("swap-out"));
  at(C + 1.35, () => { D.inst = morph(D.inst, resolved(ic.pkg, "Didn’t install dayjs", "His Market clock stays off until you do", `<button class="link" type="button">Install</button>`, "av--muted")); dock.removeAttribute("data-glow"); setHeader("idle"); });
  S.marks.answered = C + 2.3;

  // A second message does not go through.
  C += 2.8;
  at(C, () => { cursor.classList.remove("on"); follow = true; scrollGoal = null; });
  typeInto(C + 0.3, ASK2, 1.3);
  at(C + 2.0, () => {
    D.user2 = sendMessage(ASK2);
    D.user2.classList.add("pending");
    D.user2.insertAdjacentHTML("beforeend", '<span class="sending" role="status">Sending…</span>');
  });
  at(C + 3.6, () => {
    D.user2.querySelector(".sending").remove();
    D.user2.insertAdjacentHTML("beforeend", `<div class="fail enter" role="alert">${ic.alert}<span>Not sent. The connection dropped.</span><button class="link" type="button">Retry</button></div>`);
    dock.dataset.glow = "broken";
  });
  S.marks.failed = C + 4.4;

  /* ── Chapter 2: Retry works, she asks a real follow-up question, then offers next steps ── */
  const K = C + 5.2;
  S.chapters = [0, K - 0.3];
  at(K - 0.3, () => document.querySelectorAll(".demo .chap").forEach((x, i) => x.setAttribute("aria-pressed", String(i === 1))));
  at(K, () => { const b = D.user2.querySelector(".fail .link"); pointAt(b); });
  at(K + 0.8, () => press(D.user2.querySelector(".fail .link")));
  at(K + 1.0, () => {
    D.user2.classList.remove("pending");
    D.user2.querySelector(".fail").remove();
    follow = true; scrollGoal = null;
    beginRun();
    startTurn(); setScene("thinking"); setPhrase("Reading your message"); setTimer(0);
  });
  runTimer(K + 1.0, 3.0, 2);
  at(K + 2.1, () => { dock.dataset.glow = "writing"; setPhrase("Putting it into words"); });
  let Q = stream(K + 2.2, "A lying parrot, lovely. One question first, because it changes his greeting.", { perWord: 0.06 });
  at(Q + 0.2, () => {
    const opts = [
      ["To customers, for Zylo", "It talks up the goods. The parrot becomes part of the sales pitch."],
      ["About Zylo, to everyone", "It blurts out fake secrets about him. Funny, and trouble in every scene."],
      ["Only to Zylo", "It lies to him alone. A running joke between the two of them."],
    ];
    D.ask = addBlock(`<section class="ask" aria-label="Question from Professor Mari" data-open="true">
      <p class="ask-q">${ic.sparkle}<span>Who does the parrot lie to?</span></p>
      <div class="expand"><div><div class="group" role="group" aria-label="Answers">
        ${opts.map(([b, sm], i) => `<button class="opt enter" type="button" style="animation-delay:${0.08 * (i + 1)}s"><kbd>${i + 1}</kbd><span><b>${b}</b><small>${sm}</small></span></button>`).join("")}
        <button class="opt opt--other enter" type="button" style="animation-delay:.32s"><kbd>${ic.pen}</kbd><span>Something else…</span></button>
      </div></div></div></section>`);
    setPhrase("Waiting for your answer");
  });
  at(Q + 0.9, () => waitForAnswer());
  S.marks.question = Q + 2.3;
  const A = Q + 3.6;
  at(A, () => pointAt(D.ask.querySelectorAll(".opt")[1]));
  at(A + 0.8, () => press(D.ask.querySelectorAll(".opt")[1]));
  S.marks.picked = A + 1.2;
  at(A + 1.0, () => { D.ask.querySelectorAll(".opt").forEach((o, i) => (i === 1 ? (o.dataset.picked = "true", o.querySelector("kbd").innerHTML = keptMark) : (o.dataset.dimmed = "true"))); });
  at(A + 1.5, () => {
    D.ask.dataset.open = "false";
    D.live.remove();
    input.dataset.placeholder = "Ask Professor Mari";
    sendMessage("About Zylo, to everyone.");
    beginRun();
    startTurn(); setScene("thinking"); setPhrase("Thinking about Zylo Vantrell"); setTimer(0);
  });
  const R0 = A + 1.5, PARROT = { scene: "editing", icon: ic.pen, live: "Editing character", done: "Edited character", q: "Zylo Vantrell", dur: "2s", detail: "<span>Description, greeting</span><span>Saved a restore point first</span>" };
  at(R0 + 0.9, () => { setScene("editing"); setPhrase(PARROT.live, PARROT.q); });
  at(R0 + 2.6, () => addStep(PARROT));
  at(R0 + 2.7, () => { dock.dataset.glow = "writing"; setPhrase("Putting it into words"); });
  let W = stream(R0 + 2.8, "Done. His parrot, **Captain Fib**, now invents secrets about Zylo in the middle of his deals. I added it to his description and greeting.", { perWord: 0.06 });
  at(W + 0.25, () => addBlock(`<section class="group" aria-label="Changes">
      <div class="row" data-open="false">
        <button class="row-head" type="button" aria-expanded="false">${av(ENT.zylo)}<span class="row-text"><span class="row-title"><span>Zylo Vantrell</span></span><span class="row-meta">Character · description, greeting</span></span><span class="row-end">2 changes${ic.chev}</span></button>
        <div class="expand"><div><div class="row-body"><div class="fields">
          <div class="field"><span class="field-label">Description</span><p class="field-text">… and he never pays full price for anything.<ins> His parrot, Captain Fib, sells fake secrets about him to anyone who listens.</ins></p></div>
          <div class="field"><span class="field-label">Greeting</span><p class="field-text greet"><em>Zylo slides a crate lid shut with his boot.</em><ins> <em>“He killed a man in Oxbridge,” the parrot offers.</em></ins> Hello, traveler. You didn’t see that.</p></div>
        </div><div class="actions"><button class="link" type="button">${ic.undo}Undo</button><button class="btn" type="button">Keep</button></div></div></div></div>
      </div></section>`));
  runTimer(R0, W + 0.9 - R0, 5);
  at(W + 0.9, () => finishTurn("Worked for 5s · 1 step", 5));
  at(W + 4.1, () => { dock.removeAttribute("data-working"); dock.removeAttribute("data-glow"); });
  at(W + 5.9, () => setScene("idle", { hop: false }));
  // Next steps, built from this chat: real names, and a line that says what happens.
  at(W + 1.6, () => {
    nextRow.innerHTML = `
      <button class="next-card" type="button">${av(ENT.zylo)}<span><b>Start a chat with Zylo</b><small>He opens mid-deal</small></span></button>
      <button class="next-card" type="button" style="animation-delay:.08s">${av(ENT.maren)}<span><b>Give Maren a greeting</b><small>She has none yet</small></span></button>
      <button class="next-card" type="button" style="animation-delay:.16s">${av(ENT.market)}<span><b>Fix the market lore</b><small>It still contradicts Zylo</small></span></button>`;
    nextRow.hidden = false;
    follow = true;
  });
  at(W + 3.4, () => pointAt(nextRow.querySelector(".next-card")));
  S.marks.suggestions = W + 3.9;
  at(W + 5.4, () => { cursor.classList.remove("on"); nextRow.querySelector(".is-hover")?.classList.remove("is-hover"); });
  S.endAt = W + 6.2;
  S.events.sort((a, b) => a.t - b.t);
}

/* ───────────── loop ───────────── */
let last = performance.now();
function syncAnimations() {
  for (const a of document.getAnimations()) {
    if (a.playbackRate !== S.speed) a.playbackRate = S.speed;
    if (S.paused && a.playState === "running") a.pause();
    else if (!S.paused && a.playState === "paused") a.play();
  }
}
// Follow the newest output, or glide to what the demo is about to click.
function scrollStep(dt) {
  const max = transcript.scrollHeight - transcript.clientHeight;
  const goal = follow ? max : scrollGoal;
  if (goal == null) return;
  const d = Math.max(0, Math.min(max, goal)) - transcript.scrollTop;
  transcript.scrollTop += Math.abs(d) < 1 ? d : d * Math.min(1, dt * 7);
}
function frame(now) {
  const dt = Math.min(0.1, (now - last) / 1000); last = now;
  if (!S.paused && !S.frozen && S.t <= S.endAt + 0.5) step(dt * S.speed);
  if (!S.paused) scrollStep(dt * S.speed);
  const max = transcript.scrollHeight - transcript.clientHeight;
  transcript.dataset.following = String(follow && max > 8);
  syncAnimations();
  $("#c-clock").textContent = `${Math.min(S.t, S.endAt).toFixed(1)}s`;
  requestAnimationFrame(frame);
}

function play(fromT = 0) {
  reset();
  if (fromT > 0) {
    S.seeking = true;
    document.documentElement.classList.add("seeking");
    for (let t = 0; t < fromT; t += 0.02) { step(0.02); scrollStep(0.02); }
    void document.body.offsetHeight;
    document.documentElement.classList.remove("seeking");
    S.seeking = false;
    if (hovercard) { const a = hovercard.anchor, k = a.dataset.ent; showHover(a, k); }
    if (cursor.classList.contains("on") && D.pointed) { cursor.style.transition = "none"; pointAt(D.pointed); requestAnimationFrame(() => (cursor.style.transition = "")); }
  }
}

/* ───────────── controls ───────────── */
const root = document.documentElement;
function setTheme(t) { root.dataset.theme = t; $("#c-theme").textContent = t === "dark" ? "Light" : "Dark"; $("#c-theme").setAttribute("aria-label", `Switch to ${t === "dark" ? "light" : "dark"} theme`); }
document.querySelectorAll(".demo .chap").forEach((b) => (b.onclick = () => {
  S.paused = false; $("#c-pause").textContent = "Pause";
  play(S.chapters[Number(b.dataset.chapter)]);
  document.querySelectorAll(".demo .chap").forEach((x) => x.setAttribute("aria-pressed", String(x === b)));
}));
$("#c-replay").onclick = () => { S.paused = false; $("#c-pause").textContent = "Pause"; $("#c-pause").setAttribute("aria-pressed", "false"); play(); };
$("#c-pause").onclick = (e) => { S.paused = !S.paused; e.currentTarget.textContent = S.paused ? "Play" : "Pause"; e.currentTarget.setAttribute("aria-pressed", String(S.paused)); };
$("#c-theme").onclick = () => setTheme(root.dataset.theme === "dark" ? "light" : "dark");
$("#c-speed").onclick = (e) => { S.speed = S.speed === 1 ? 2 : 1; e.currentTarget.textContent = `${S.speed}×`; };
$("#c-speed").textContent = `${S.speed}×`;
$("#demo-bubble").onclick = (e) => { const open = $("#demo").classList.toggle("open"); e.currentTarget.setAttribute("aria-expanded", String(open)); };
// Rows work by hand too: a row with details opens and closes in place; a name shows its card.
document.addEventListener("click", (e) => {
  const head = e.target.closest("button.row-head");
  if (head) { const r = head.closest(".row"); setOpen(r, r.dataset.open !== "true"); }
});
document.addEventListener("mouseover", (e) => { const m = e.target.closest(".mention"); if (m && hovercard?.anchor !== m) showHover(m, m.dataset.ent); });
document.addEventListener("mouseout", (e) => { const m = e.target.closest(".mention"); if (m && !m.contains(e.relatedTarget)) hideHover(); });
transcript.addEventListener("scroll", () => placeHover());
document.addEventListener("click", (e) => { if (e.target.closest("a[href='#']")) e.preventDefault(); });

setTheme(params.get("theme") || "dark");
if (params.get("controls") === "0") root.dataset.controls = "0";
build();
play(params.get("mark") ? S.marks[params.get("mark")] : Number(params.get("t")) || 0);
S.frozen = params.get("freeze") === "1";
requestAnimationFrame(frame);
</script>
</body>
